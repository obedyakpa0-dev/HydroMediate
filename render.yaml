services:
  - type: web
    name: hydromediate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: backend
